<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Visualizar Questão</title>
    <style>
        :root {
            --bg-page: #f5f5f7;
            --text-main: #1d1d1f;
            --text-light: #86868b;
            --border-color: transparent;
            --accent: #0071e3;
            --success: #34c759;
            --error: #ff3b30;
            --radius: 12px;
            --btn-gray-dark: #8e8e93;
            --btn-gray-light: #aeb0b5;
        }

        /* --- PROTEÇÃO ANTI-CÓPIA --- */
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        @media print {
            html, body { display: none !important; }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            opacity: 1;
        }

        /* --- HEADER --- */
        .header-unificado {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        .top-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            height: 44px;
            white-space: nowrap;
        }

        .top-item svg { width: 20px; height: 20px; fill: white; }
        .bg-verde-ativo { background-color: var(--success); }
        .bg-cinza-claro { background-color: var(--btn-gray-light); }

        /* --- FRAÇÕES --- */
        .fracao {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 4px;
            font-size: 1.1em;
            pointer-events: none;
        }
        .fracao .num { border-bottom: 2px solid currentColor; padding: 0 5px; display: block; line-height: 1.2; font-weight: 700; }
        .fracao .den { padding: 2px 5px 0 5px; display: block; line-height: 1.2; font-weight: 700; }

        /* --- LAYOUT QUESTÃO --- */
        .secao-pergunta {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 50px;
        }

        .coluna-imagem {
            flex: 1.2;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-direction: column;
            width: 100%;
        }

        .img-atividade {
            max-width: 100%;
            max-height: 550px;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: var(--radius);
            pointer-events: none;
            display: block;
            margin: 0 auto 30px auto;
        }

        .coluna-conteudo { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .topo-info {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .enunciado {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 30px;
            line-height: 1.5;
            color: var(--text-main);
        }
        .enunciado b { font-weight: 700; }

        .grid-opcoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-opcao {
            background-color: transparent;
            border: 1px solid #d2d2d7;
            border-radius: var(--radius);
            aspect-ratio: 1 / 1;
            font-size: 1.4rem;
            cursor: default;
            transition: all 0.2s ease;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Estados das respostas */
        .btn-opcao.certo { 
            border-color: var(--success); 
            color: var(--success); 
            background-color: rgba(52, 199, 89, 0.1); 
        }
        .btn-opcao.errado { 
            border-color: var(--error); 
            color: var(--error); 
            background-color: rgba(255, 59, 48, 0.1); 
        }

        /* Seção de resposta */
        .secao-resposta {
            padding-top: 20px;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .titulo-feedback { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; display: block; }
        .texto-resolucao { font-size: 1.1rem; line-height: 1.6; color: var(--text-main); margin-bottom: 20px; }

        /* Badge de status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        
        .status-badge.acerto {
            background-color: rgba(52, 199, 89, 0.15);
            color: var(--success);
        }
        
        .status-badge.erro {
            background-color: rgba(255, 59, 48, 0.15);
            color: var(--error);
        }

        /* Rodapé */
        .rodape {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn-voltar {
            background-color: var(--btn-gray-dark);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-voltar:hover { background-color: var(--accent); transform: scale(1.02); }

        .texto-creditos { font-size: 0.8rem; color: var(--text-light); }

        /* Loading e Erro */
        .loading, .erro {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .erro {
            color: var(--error);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e5ea;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsividade */
        @media (max-width: 900px) {
            .secao-pergunta { flex-direction: column; }
            .grid-opcoes { grid-template-columns: repeat(4, 1fr); }
            .img-atividade {
                max-width: 100%;
                max-height: 550px;
            }
        }
        
        @media (max-width: 600px) {
            .grid-opcoes { grid-template-columns: repeat(2, 1fr); }
            .header-unificado { gap: 10px; }
            .top-item { padding: 10px 15px; font-size: 0.8rem; }
            .enunciado { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div id="appContainer" class="app-container">
        <div class="header-unificado">
            <div class="top-item bg-verde-ativo" id="btnModo">Visualizar Questão</div>
            <div class="top-item bg-cinza-claro" id="btnInfo">Carregando...</div>
        </div>

        <div id="conteudo">
            <div class="loading">
                <div class="spinner"></div>
                <p>Carregando questão...</p>
            </div>
        </div>

        <div class="rodape">
            <button class="btn-voltar" onclick="window.close()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                Fechar
            </button>
            <span class="texto-creditos">Desenvolvido por Gilberto Fernandes - Matemática</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 📌 VARIÁVEIS GLOBAIS
        // ==========================================
        let questoesIntro = [];
        let questoesComp = [];
        let questaoAtual = null;
        let modoAtual = 'intro';
        let indexAtual = 0;

        // ==========================================
        // 📌 PARÂMETROS DA URL
        // ==========================================
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),
                modo: params.get('modo'),
                index: params.get('index'),
                status: params.get('status')
            };
        }

        // ==========================================
        // 📌 CARREGAR BANCO DE QUESTÕES
        // ==========================================
        function carregarBancoQuestoes() {
            return new Promise((resolve, reject) => {
                // Tenta carregar o script do banco de questões
                const script = document.createElement('script');
                script.src = './banco_questoes.js';
                script.async = true;
                
                script.onload = () => {
                    // Após carregar, verifica se as variáveis globais existem
                    setTimeout(() => {
                        questoesIntro = window.questoesIntro || [];
                        questoesComp = window.questoesComp || [];
                        
                        console.log('Banco carregado:', {
                            intro: questoesIntro.length,
                            comp: questoesComp.length
                        });
                        
                        if (questoesIntro.length === 0 && questoesComp.length === 0) {
                            reject('Banco de questões vazio. Verifique se o arquivo banco_questoes.js está correto.');
                        } else {
                            resolve();
                        }
                    }, 100); // Pequeno delay para garantir que o script executou
                };
                
                script.onerror = () => {
                    reject('Não foi possível carregar o arquivo banco_questoes.js. Verifique se o arquivo existe na mesma pasta.');
                };
                
                document.head.appendChild(script);
            });
        }

        // ==========================================
        // 📌 PROCESSAR QUESTÃO
        // ==========================================
        function processarQuestao() {
            const params = getUrlParams();
            console.log('Parâmetros URL:', params);
            
            // Determinar modo e índice
            let modo = 'intro';
            let index = 0;

            if (params.id) {
                // Formato: "intro-0" ou "complementar-5"
                const partes = params.id.split('-');
                if (partes.length >= 2) {
                    const modoRaw = partes[0].toLowerCase();
                    modo = modoRaw.includes('comp') ? 'complementar' : 'intro';
                    index = parseInt(partes[1]);
                    if (isNaN(index)) index = 0;
                } else if (!isNaN(parseInt(params.id))) {
                    // Apenas número
                    index = parseInt(params.id);
                }
            } else if (params.modo && params.index !== null) {
                modo = params.modo.includes('comp') ? 'complementar' : 'intro';
                index = parseInt(params.index) || 0;
            }

            modoAtual = modo;
            indexAtual = index;

            console.log('Modo:', modo, 'Índice:', index);
            console.log('Questões disponíveis:', {
                intro: questoesIntro.length,
                comp: questoesComp.length
            });

            // Selecionar array correto
            const questoes = modo === 'intro' ? questoesIntro : questoesComp;
            
            // Validar
            if (!questoes || questoes.length === 0) {
                mostrarErro(`Nenhuma questão disponível no modo "${modo}".`);
                return;
            }

            if (index < 0 || index >= questoes.length) {
                mostrarErro(`Questão ${index + 1} não encontrada. O modo ${modo} tem ${questoes.length} questões (índices 0-${questoes.length - 1}).`);
                return;
            }

            questaoAtual = questoes[index];
            renderizarQuestao(questaoAtual, modo, index, params.status);
        }

        // ==========================================
        // 📌 RENDERIZAR QUESTÃO (MESMO LAYOUT DO INDEX)
        // ==========================================
        function renderizarQuestao(questao, modo, index, status) {
            const container = document.getElementById('conteudo');
            
            // Atualizar header
            const tipoTexto = modo === 'intro' ? 'Introdução I' : 'Atividade Complementar';
            document.getElementById('btnModo').textContent = tipoTexto;
            document.getElementById('btnInfo').textContent = `Questão ${index + 1}`;

            // Badge de status (se veio do ranking)
            let statusHTML = '';
            if (status === 'acerto') {
                statusHTML = `
                    <div class="status-badge acerto">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                        Questão Acertada pelo Aluno
                    </div>
                `;
            } else if (status === 'erro') {
                statusHTML = `
                    <div class="status-badge erro">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        Questão Errada pelo Aluno
                    </div>
                `;
            }

            // Processar imagem
            const imgSrc = questao.img || questao.imagem || '';
            
            // Processar enunciado
            const enunciado = questao.pergunta || questao.enunciado || questao.texto || 'Sem enunciado';

            // Processar alternativas
            const opcoes = questao.opcoes || questao.alternativas || [];
            const correta = questao.correta;
            
            // Se correta for array, pegar o primeiro
            const indiceCorreta = Array.isArray(correta) ? correta[0] : correta;
            
            let opcoesHTML = '';
            opcoes.forEach((opt, i) => {
                let classe = '';
                if (i === indiceCorreta) {
                    classe = 'certo'; // Resposta correta sempre verde
                }
                // Se tiver status de erro e for a resposta errada do aluno, poderia marcar
                // Mas como não sabemos qual o aluno escolheu, mostramos só a correta
                
                opcoesHTML += `
                    <div class="btn-opcao ${classe}">
                        ${opt}
                    </div>
                `;
            });

            // Resolução
            const resolucao = questao.resolucao || questao.explicacao || 'Sem resolução disponível.';

            container.innerHTML = `
                ${statusHTML}
                
                <section class="secao-pergunta">
                    <div class="coluna-imagem">
                        ${imgSrc ? `<img class="img-atividade" src="${imgSrc}" alt="Questão">` : ''}
                    </div>

                    <div class="coluna-conteudo">
                        <div class="topo-info">
                            <div>
                                <span style="color:var(--success)">Resposta Correta</span>
                            </div>
                        </div>

                        <div class="enunciado">${enunciado}</div>
                        
                        <div class="grid-opcoes">
                            ${opcoesHTML}
                        </div>
                    </div>
                </section>

                <section class="secao-resposta">
                    <span class="titulo-feedback" style="color: var(--success)">Resolução</span>
                    <div class="texto-resolucao">${resolucao}</div>
                </section>
            `;
        }

        // ==========================================
        // 📌 MOSTRAR ERRO
        // ==========================================
        function mostrarErro(mensagem) {
            document.getElementById('conteudo').innerHTML = `
                <div class="erro">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 15px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p><strong>Erro ao carregar questão:</strong></p>
                    <p>${mensagem}</p>
                    <br>
                    <p style="font-size: 0.9rem; color: var(--text-light);">
                        Verifique se:<br>
                        • O arquivo banco_questoes.js está na mesma pasta<br>
                        • A questão existe no banco de dados<br>
                        • Os parâmetros da URL estão corretos
                    </p>
                </div>
            `;
            document.getElementById('btnInfo').textContent = 'Erro';
        }

        // ==========================================
        // 📌 INICIALIZAÇÃO
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await carregarBancoQuestoes();
                processarQuestao();
            } catch (erro) {
                console.error('Erro:', erro);
                mostrarErro(erro);
            }
        });
    </script>
</body>
</html>
