<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Visualizar Questão</title>
    <style>
        /* =========================================
           🎨 ESTILO GERAL (CLEAN / APPLE STYLE)
           ========================================= */
        :root {
            --bg-page: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-light: #86868b;
            --accent: #0071e3;
            --success: #34c759;
            --warning: #ffcc00;
            --error: #ff3b30;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Fração Vertical */
        .fracao { 
            display: inline-flex; 
            flex-direction: column; 
            vertical-align: middle; 
            margin: 0 5px; 
            text-align: center; 
            font-size: 0.9em; 
        }
        .fracao > span { padding: 0 5px; }
        .fracao > span:first-child { 
            border-bottom: 2px solid currentColor; 
            padding-bottom: 1px; 
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-page); 
            color: var(--text-main); 
            min-height: 100vh;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
        }

        /* Header */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
        }
        
        .titulo-pagina { 
            font-size: 1.5rem; 
            font-weight: 700; 
            letter-spacing: -0.5px; 
        }
        
        .btn-voltar { 
            text-decoration: none; 
            color: var(--accent); 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            transition: opacity 0.2s; 
            font-size: 0.9rem;
            cursor: pointer;
            border: none;
            background: none;
        }
        .btn-voltar:hover { opacity: 0.7; }

        /* Badge de status (Acerto/Erro) */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        
        .status-badge.acerto {
            background-color: rgba(52, 199, 89, 0.15);
            color: var(--success);
        }
        
        .status-badge.erro {
            background-color: rgba(255, 59, 48, 0.15);
            color: var(--error);
        }

        /* Card da Questão */
        .questao-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            margin-bottom: 20px;
        }

        .questao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e5ea;
        }

        .questao-tipo {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        .questao-numero {
            font-size: 0.9rem;
            color: var(--accent);
            font-weight: 600;
        }

        .questao-enunciado {
            font-size: 1.2rem;
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 25px;
        }

        /* Alternativas */
        .alternativas-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .alternativa {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            background: #f5f5f7;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .alternativa:hover {
            background: #e8e8ed;
        }

        .alternativa-letra {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .alternativa-texto {
            font-size: 1rem;
            color: var(--text-main);
        }

        /* Resposta correta destacada */
        .alternativa.correta {
            background: rgba(52, 199, 89, 0.15);
            border-color: var(--success);
        }

        .alternativa.correta .alternativa-letra {
            background: var(--success);
        }

        /* Resposta errada destacada (se aplicável) */
        .alternativa.errada {
            background: rgba(255, 59, 48, 0.15);
            border-color: var(--error);
        }

        .alternativa.errada .alternativa-letra {
            background: var(--error);
        }

        /* Info da resposta */
        .resposta-info {
            margin-top: 25px;
            padding: 20px;
            background: #f5f5f7;
            border-radius: 12px;
        }

        .resposta-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .resposta-texto {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        /* Navegação */
        .navegacao {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .btn-nav {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            background: white;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-nav:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.12);
        }

        .btn-nav:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading e Erro */
        .loading, .erro {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .erro {
            color: var(--error);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e5e5ea;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .questao-card {
                padding: 20px;
            }
            
            .questao-enunciado {
                font-size: 1.1rem;
            }
            
            .navegacao {
                flex-direction: column;
                gap: 15px;
            }
            
            .btn-nav {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="btn-voltar" onclick="voltar()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
                Voltar
            </button>
            <h1 class="titulo-pagina">Visualizar Questão</h1>
            <div></div>
        </header>

        <div id="conteudo">
            <div class="loading">
                <div class="spinner"></div>
                <p>Carregando questão...</p>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 📌 VARIÁVEIS GLOBAIS
        // ==========================================
        let questoesIntro = [];
        let questoesComp = [];
        let questaoAtual = null;
        let modoAtual = 'intro'; // 'intro' ou 'complementar'
        let indexAtual = 0;

        // ==========================================
        // 📌 PARÂMETROS DA URL
        // ==========================================
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                id: params.get('id'),           // ex: "intro-0" ou "complementar-5"
                modo: params.get('modo'),       // ex: "intro" ou "complementar"
                index: params.get('index'),     // ex: "0", "5"
                status: params.get('status')    // ex: "acerto" ou "erro" (opcional)
            };
        }

        // ==========================================
        // 📌 CARREGAR BANCO DE QUESTÕES
        // ==========================================
        function carregarBancoQuestoes() {
            const candidatos = [
                "./banco_questoes.js",
                "./banco_questoes (25).js",
                "./banco_questoes (24).js",
                "./banco_questoes (23).js",
                "./banco_questoes (22).js",
                "./banco_questoes (21).js",
                "./banco_questoes(25).js",
                "./banco_questoes(24).js",
                "./banco_questoes(23).js",
                "./banco_questoes(22).js",
                "./banco_questoes(21).js"
            ];

            return new Promise((resolve) => {
                const tentar = (i) => {
                    if (i >= candidatos.length) {
                        questoesIntro = Array.isArray(window.questoesIntro) ? window.questoesIntro : [];
                        questoesComp = Array.isArray(window.questoesComp) ? window.questoesComp : [];
                        
                        if (questoesIntro.length === 0 && questoesComp.length === 0) {
                            mostrarErro('Banco de questões não encontrado. Verifique se o arquivo banco_questoes.js está na mesma pasta.');
                        }
                        resolve();
                        return;
                    }

                    const src = candidatos[i];
                    
                    // Verifica se já existe
                    const ja = [...document.scripts].some(sc => (sc.getAttribute("src") || "") === src);
                    if (ja) {
                        questoesIntro = Array.isArray(window.questoesIntro) ? window.questoesIntro : [];
                        questoesComp = Array.isArray(window.questoesComp) ? window.questoesComp : [];
                        resolve();
                        return;
                    }

                    const sc = document.createElement("script");
                    sc.src = src;
                    sc.async = true;
                    sc.onload = () => {
                        questoesIntro = Array.isArray(window.questoesIntro) ? window.questoesIntro : [];
                        questoesComp = Array.isArray(window.questoesComp) ? window.questoesComp : [];
                        resolve();
                    };
                    sc.onerror = () => tentar(i + 1);
                    document.head.appendChild(sc);
                };

                tentar(0);
            });
        }

        // ==========================================
        // 📌 PROCESSAR PARÂMETROS E ABRIR QUESTÃO
        // ==========================================
        function processarQuestao() {
            const params = getUrlParams();
            
            // Determinar modo e índice
            let modo = 'intro';
            let index = 0;

            if (params.id) {
                // Formato: "intro-0" ou "complementar-5"
                const partes = params.id.split('-');
                if (partes.length >= 2) {
                    modo = partes[0].includes('comp') ? 'complementar' : 'intro';
                    index = parseInt(partes[1]) || 0;
                }
            } else if (params.modo && params.index !== null) {
                // Parâmetros separados
                modo = params.modo.includes('comp') ? 'complementar' : 'intro';
                index = parseInt(params.index) || 0;
            }

            modoAtual = modo;
            indexAtual = index;

            // Selecionar array correto
            const questoes = modo === 'intro' ? questoesIntro : questoesComp;
            
            // Validar índice
            if (!questoes || questoes.length === 0) {
                mostrarErro('Nenhuma questão disponível no banco de dados.');
                return;
            }

            if (index < 0 || index >= questoes.length) {
                mostrarErro(`Questão não encontrada. Índice ${index} inválido para o modo ${modo}.`);
                return;
            }

            questaoAtual = questoes[index];
            renderizarQuestao(questaoAtual, modo, index, params.status);
        }

        // ==========================================
        // 📌 RENDERIZAR QUESTÃO
        // ==========================================
        function renderizarQuestao(questao, modo, index, status) {
            const container = document.getElementById('conteudo');
            
            // Determinar tipo de questão
            const tipoTexto = modo === 'intro' ? 'Introdução' : 'Complementar';
            
            // Status badge (se veio do ranking)
            let statusHTML = '';
            if (status === 'acerto') {
                statusHTML = `
                    <div class="status-badge acerto">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                        Questão Acertada
                    </div>
                `;
            } else if (status === 'erro') {
                statusHTML = `
                    <div class="status-badge erro">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        Questão com Erro
                    </div>
                `;
            }

            // Processar enunciado (formatar frações)
            const enunciado = formatarFracoes(questao.pergunta || questao.enunciado || questao.texto || 'Sem enunciado');

            // Processar alternativas
            const alternativas = questao.alternativas || questao.opcoes || [];
            const correta = questao.correta || questao.respostaCorreta || 0;
            
            let alternativasHTML = '';
            alternativas.forEach((alt, i) => {
                const letra = String.fromCharCode(65 + i); // A, B, C, D...
                const texto = formatarFracoes(alt);
                const isCorreta = i === correta;
                
                alternativasHTML += `
                    <div class="alternativa ${isCorreta ? 'correta' : ''}">
                        <div class="alternativa-letra">${letra}</div>
                        <div class="alternativa-texto">${texto}</div>
                    </div>
                `;
            });

            // Info da resposta correta
            const respostaLetra = String.fromCharCode(65 + correta);
            
            container.innerHTML = `
                ${statusHTML}
                
                <div class="questao-card">
                    <div class="questao-header">
                        <span class="questao-tipo">${tipoTexto}</span>
                        <span class="questao-numero">Questão ${index + 1} de ${modo === 'intro' ? questoesIntro.length : questoesComp.length}</span>
                    </div>
                    
                    <div class="questao-enunciado">${enunciado}</div>
                    
                    <div class="alternativas-container">
                        ${alternativasHTML}
                    </div>
                    
                    <div class="resposta-info">
                        <div class="resposta-label">Resposta Correta</div>
                        <div class="resposta-texto">Alternativa ${respostaLetra}</div>
                    </div>
                </div>
                
                <div class="navegacao">
                    <button class="btn-nav" onclick="navegarAnterior()" ${index === 0 ? 'disabled' : ''}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                        Anterior
                    </button>
                    
                    <button class="btn-nav" onclick="navegarProxima()" ${index >= (modo === 'intro' ? questoesIntro.length : questoesComp.length) - 1 ? 'disabled' : ''}>
                        Próxima
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </button>
                </div>
            `;
        }

        // ==========================================
        // 📌 UTILITÁRIOS
        // ==========================================
        function formatarFracoes(texto) {
            if (!texto) return '';
            // Converte "3/4" para fração vertical HTML
            return texto.replace(/(\d+)\s*\/\s*(\d+)/g, (match, num, den) => {
                return `<span class="fracao"><span>${num}</span><span>${den}</span></span>`;
            });
        }

        function mostrarErro(mensagem) {
            document.getElementById('conteudo').innerHTML = `
                <div class="erro">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 15px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p><strong>Erro:</strong> ${mensagem}</p>
                </div>
            `;
        }

        // ==========================================
        // 📌 NAVEGAÇÃO
        // ==========================================
        function navegarAnterior() {
            if (indexAtual > 0) {
                indexAtual--;
                atualizarUrl();
                processarQuestao();
            }
        }

        function navegarProxima() {
            const max = modoAtual === 'intro' ? questoesIntro.length : questoesComp.length;
            if (indexAtual < max - 1) {
                indexAtual++;
                atualizarUrl();
                processarQuestao();
            }
        }

        function atualizarUrl() {
            const novaUrl = `?id=${modoAtual}-${indexAtual}&modo=${modoAtual}&index=${indexAtual}`;
            window.history.replaceState({}, '', novaUrl);
        }

        function voltar() {
            // Tenta voltar para o ranking, se não consegue, vai para index
            if (window.opener && !window.opener.closed) {
                window.close();
            } else {
                window.location.href = 'ranking.html';
            }
        }

        // ==========================================
        // 📌 INICIALIZAÇÃO
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            await carregarBancoQuestoes();
            processarQuestao();
        });
    </script>
</body>
</html>
